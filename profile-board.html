<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web3 NFT Landing Page - Full Integration</title>
<style>
/* --- Browser Reset + Monokai Dark Theme --- */
*,
*::before,*::after {margin:0; padding:0; box-sizing:border-box;}
html, body {height:100%; width:100%; font-family:'Fira Code', monospace; background:#272822; color:#f8f8f2; overflow-x:hidden;}

/* --- Layout --- */
section {padding:80px 20px; width:100%; text-align:center;}
main {position:relative;}
canvas {display:block; width:100%; height:600px;}

/* --- Hero Section UI --- */
h1.hero {color:#f8f8f2; font-size:3rem; text-shadow:0 0 15px #f8f8f2; margin-bottom:20px;}
h2.subheader {color:#a6e22e; text-shadow:0 0 10px #a6e22e; margin-bottom:10px;}
h3.teaser {color:#e6db74; text-shadow:0 0 8px #e6db74; margin-bottom:20px;}
button.redBtn {background:#8B0000; color:white; padding:15px 30px; font-size:1.1rem; text-shadow:0 0 5px #8B0000; border-radius:5px;}
button.redBtn:hover {box-shadow:0 0 20px rgba(139,0,0,0.7);}
#ui {position:absolute; top:30px; left:50%; transform:translateX(-50%); z-index:10;}

/* --- Features Section --- */
.feature-box {display:inline-block; width:250px; margin:20px; padding:20px; border:1px solid #66d9ef; border-radius:10px; text-align:center;}
.feature-box h4 {color:#a6e22e; margin-bottom:10px;}
.feature-box p {color:#f8f8f2;}

/* --- Graph Section --- */
#graph {width:100%; height:600px; margin-top:40px; border:1px solid #66d9ef; border-radius:10px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Add Cambridge Intelligence ReGraph -->
<script src="https://cdn.jsdelivr.net/npm/@cambridge-intelligence/regraph@6.0.0/dist/regraph.min.js"></script>
<script type="module">
import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.8.0/dist/ethers.esm.min.js";

const WALLET_ADDRESS = "0xYourWalletAddressHere";
const CONTRACT_ADDRESS = "0x21a31Ee1afC51d94C2eFcCAa2092aD1028285549";
const provider = new ethers.JsonRpcProvider("http://localhost:8545");

const contractAbi = [
  "function balanceOf(address owner) view returns (uint256)",
  "function tokenOfOwnerByIndex(address owner, uint256 index) view returns (uint256)"
];
const nftContract = new ethers.Contract(CONTRACT_ADDRESS, contractAbi, provider);

// --- Three.js Scene ---
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/600, 0.1, 1000);
camera.position.set(0,50,150);
let renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, 600);
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff,0.7));
scene.add(new THREE.DirectionalLight(0xffffff,0.5));

// --- NFT Rootings Field ---
let nftFieldGeo = new THREE.BufferGeometry();
let nftParticles;

async function setupNFTField() {
    const balance = await nftContract.balanceOf(WALLET_ADDRESS);
    const positions=[], colors=[];
    for(let i=0;i<balance;i++){
        const tokenId = await nftContract.tokenOfOwnerByIndex(WALLET_ADDRESS,i);
        const angle = i*(Math.PI*2/balance);
        const radius = 30 + Math.random()*15;
        const x = radius*Math.cos(angle);
        const z = radius*Math.sin(angle);
        const pooledOn = Math.random() > 0.5; // example pooled state
        const y = pooledOn ? 15+Math.random()*5 : 5+Math.random()*2;
        positions.push(x,y,z);
        const color = new THREE.Color(pooledOn ? 0xffa500 : 0x444444);
        colors.push(color.r,color.g,color.b);
    }
    nftFieldGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    nftFieldGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
    nftParticles = new THREE.Points(nftFieldGeo, new THREE.PointsMaterial({vertexColors:true, size:2}));
    scene.add(nftParticles);
}
setupNFTField();

// --- Animate NFT Field ---
function animateNFTField() {
    const colors = nftFieldGeo.attributes.color.array;
    const positions = nftFieldGeo.attributes.position.array;
    for(let i=0;i<colors.length;i+=3){
        const pooledOn = Math.random()>0.5;
        const color = new THREE.Color(pooledOn ? 0xffa500 : 0x444444);
        colors[i]=color.r; colors[i+1]=color.g; colors[i+2]=color.b;
    }
    nftFieldGeo.attributes.color.needsUpdate=true;
    for(let i=1;i<positions.length;i+=3){ positions[i]+=(Math.random()-0.5); }
    nftFieldGeo.attributes.position.needsUpdate=true;
    requestAnimationFrame(animateNFTField);
}
animateNFTField();

// --- Render Loop ---
function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera);}
animate();
window.addEventListener('resize',()=>{ camera.aspect = window.innerWidth/600; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,600); });

// --- Graph of Timestamped Miner Locations ---
const graphDiv = document.createElement('div');
graphDiv.id = 'graph';
document.body.appendChild(graphDiv);

// Example miner locations (replace with live Ethereum + Lightning API)
const nodes = [
    { id:'eth1', label:'Ethereum Miner', x:-100, y:50, timestamp:1696200000 },
    { id:'lt1', label:'Lightning Miner', x:50, y:-50, timestamp:1696200100 },
];
const edges = [{ id:'e1', source:'eth1', target:'lt1', timestamp:1696200050 }];

const graphData = { nodes, edges };
const config = {
    container: graphDiv,
    data: graphData,
    layout: { type:'geo', projection:'mercator' },
    nodeStyle: node=>({ fill: node.timestamp? '#66d9ef':'#a6e22e' }),
    edgeStyle: edge=>({ stroke:'#f8f8f2', width:1 })
};
const graph = new ReGraph(config);

</script>

<body>
<div id="ui">
    <h1 class="hero">Enter the Web3 NFT Realm</h1>
    <h2 class="subheader">Interactive NFT Rootings Field</h2>
    <h3 class="teaser">Visualize NFT pooled states & miner activity</h3>
    <button class="redBtn" onclick="setupNFTField()">Refresh NFT Field</button>
</div>
</body>
</html>
